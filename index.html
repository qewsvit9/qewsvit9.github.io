    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(11, 16, 28, 0.95);
            --border-color: #1e293b;
            --accent: #38bdf8;
            --green: #22c55e;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #0d1b33 0%, transparent 70%);
            color: var(--text-main);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
            cursor: url('https://api.iconify.design/lucide:paw-print.svg?color=%2338bdf8&width=24'), auto;
        }

        #frost-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            transition: opacity 1s ease;
            background: radial-gradient(circle, rgba(56,189,248,0.25) 0%, rgba(255,255,255,0.5) 100%);
            box-shadow: inset 0 0 150px rgba(255,255,255,0.8);
        }
        #frost-overlay.active { opacity: 1; }

        .snowflake {
            position: absolute;
            top: -50px;
            color: #ffffff;
            user-select: none;
            pointer-events: none;
            z-index: 5;
            animation: snowfall linear infinite;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.7));
        }

        @keyframes snowfall {
            0% { transform: translateY(-50px) translateX(0) rotate(0deg); }
            50% { transform: translateY(50vh) translateX(35px) rotate(180deg); }
            100% { transform: translateY(105vh) translateX(-35px) rotate(360deg); }
        }

        .easter-counter {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Unbounded', sans-serif;
            font-size: 11px;
            color: #fff;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            cursor: pointer;
            transition: 0.2s;
        }
        .easter-counter:hover { transform: scale(1.05); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            padding: 20px;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        
        .modal-card {
            background: #111827;
            border: 3px solid var(--accent);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            animation: popUp 0.3s ease;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes popUp {
            0% { transform: scale(0.7); }
            100% { transform: scale(1); }
        }

        .rarity-rare { border-color: #38bdf8; box-shadow: 0 0 20px #38bdf8; }
        .rarity-epic { border-color: #a855f7; box-shadow: 0 0 25px #a855f7; }
        .rarity-legendary { border-color: #f59e0b; box-shadow: 0 0 30px #f59e0b, inset 0 0 15px #fbbf24; }
        .rarity-mythic { border-color: #ef4444; box-shadow: 0 0 30px #ef4444; background: linear-gradient(135deg, #180505, #111827); }
        .rarity-ultra { border-color: #06b6d4; box-shadow: 0 0 35px #06b6d4; }
        .rarity-chromatic { border-image: linear-gradient(45deg, red, yellow, green, cyan, blue, violet) 1; box-shadow: 0 0 35px #ec4899; }
        .rarity-absolute { border-color: #ff007f; box-shadow: 0 0 50px #ff007f, inset 0 0 30px #3b82f6; background: radial-gradient(circle, #000000 60%, #1e1b4b 100%); }

            line-height: 1.5;

            flex-wrap: wrap;
