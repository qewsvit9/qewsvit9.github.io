<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qewsvit9.github.io - Minecraft Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0f17;
            --card-bg: #141a26;
            --border-color: #222c40;
            --accent: #3b82f6;
            --green: #22c55e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(12, 15, 23, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-family: 'Unbounded', sans-serif;
            font-size: 18px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span small {
            display: block;
            font-size: 10px;
            color: var(--green);
            font-family: 'Manrope', sans-serif;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(24px, 4vw, 42px);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        h1 span { color: var(--accent); }

        p {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            font-size: 14px;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .status-strip {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            text-align: center;
        }

        .status-cell span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .status-cell b {
            font-size: 14px;
            font-family: 'Unbounded', sans-serif;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <a class="brand" href="#">
            <span>
                qewsvit9
                <small>#server-hub</small>
            </span>
        </a>
        <div style="font-size: 14px; color: var(--text-muted);">Java Edition • 2026</div>
    </header>

    <main class="hero">
        <h1>Динамічність. Затишок. <span>Майнкрафт.</span></h1>
        <p>Головний хаб проєктів, збірок та особистий простір у стилі найкращих серверних спільнот.</p>
        
        <div class="actions">
            <a href="https://github.com/qewsvit9" target="_blank" class="btn primary">GitHub Профіль</a>
            <button class="btn" onclick="copyIP()">Скопіювати IP</button>
        </div>
    </main>

    <section class="status-strip">
        <div class="status-cell">
            <span>Статус</span>
            <b style="color: var(--green);">ONLINE</b>
        </div>
        <div class="status-cell">
            <span>Версія</span>
            <b>1.21.1</b>
        </div>
        <div class="status-cell">
            <span>Хостинг</span>
            <b>GitHub Pages</b>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 qewsvit9.github.io. Всі права захищені вайбом.</p>
    </footer>

    <script>
        function copyIP() {
            navigator.clipboard.writeText("qewsvit9.github.io");
            alert("IP скопійовано у буфер обміну!");
        }
    </script>

</body>
</html>
