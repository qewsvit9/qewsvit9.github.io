<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qewsvit9.github.io - Minecraft Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070b14;
            --card-bg: rgba(13, 19, 33, 0.85);
            --border-color: #1a2744;
            --accent: #38bdf8;
            --green: #22c55e;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #0f1d36 0%, transparent 70%);
            color: var(--text-main);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
        }

        /* Зимний снег (анимация) */
        .snowflake {
            position: absolute;
            top: -10px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) translateX(0);
                opacity: 0.8;
            }
            50% {
                transform: translateY(50vh) translateX(20px);
                opacity: 0.5;
            }
            100% {
                transform: translateY(105vh) translateX(-20px);
                opacity: 0.2;
            }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(7, 11, 20, 0.7);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-family: 'Unbounded', sans-serif;
            font-size: 18px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand span small {
            display: block;
            font-size: 10px;
            color: var(--green);
            font-family: 'Manrope', sans-serif;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
            z-index: 10;
        }

        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(22px, 4vw, 38px);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        h1 span { color: var(--accent); }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            font-size: 13px;
            font-family: 'Unbounded', sans-serif; /* Исправлен шрифт на правильный */
        }

        .btn.primary {
            background: #0284c7;
            border-color: #0369a1;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .status-strip {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .status-cell span {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .status-cell b {
            font-size: 13px;
            font-family: 'Unbounded', sans-serif;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <a class="brand" href="#">
            <span>
                qewsvit9
                <small>#server-hub</small>
            </span>
        </a>
        <div style="font-size: 13px; color: var(--text-muted); font-family: 'Unbounded', sans-serif;">Java Edition • 2026</div>
    </header>

    <main class="hero">
        <h1>Динамичность. Зима. <span>Майнкрафт.</span></h1>
        <p>Главный хаб проектов, сборок и личное пространство в стиле атмосферных зимних серверов.</p>
        
        <div class="actions">
            <a href="https://github.com/qewsvit9" target="_blank" class="btn primary">GitHub Профиль</a>
            <button class="btn" onclick="copyIP()">Скопировать IP</button>
        </div>
    </main>

    <section class="status-strip">
        <div class="status-cell">
            <span>Статус</span>
            <b style="color: var(--green);">ONLINE</b>
        </div>
        <div class="status-cell">
            <span>Версия</span>
            <b>1.21.1</b>
        </div>
        <div class="status-cell">
            <span>Хостинг</span>
            <b>GitHub Pages</b>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 qewsvit9.github.io. Зимний вайб под контролем.</p>
    </footer>

    <script>
        // Генерация падающего снега
        function createSnowflake() {
            const snow = document.createElement('div');
            snow.classList.add('snowflake');
            snow.style.left = Math.random() * window.innerWidth + 'px';
            snow.style.top = '-10px';
            
            const size = Math.random() * 4 + 2 + 'px'; // Размер снежинки
            snow.style.width = size;
            snow.style.height = size;
            
            const duration = Math.random() * 3 + 2 + 's'; // Скорость падения
            snow.style.animationDuration = duration;
            
            snow.style.opacity = Math.random() * 0.7 + 0.3;

            document.body.appendChild(snow);

            setTimeout(() => {
                snow.remove();
            }, parseFloat(duration) * 1000);
        }

        setInterval(createSnowflake, 100);

        function copyIP() {
            navigator.clipboard.writeText("qewsvit9.github.io");
            alert("IP скопирован в буфер обмена!");
        }
    </script>

</body>
</html>
