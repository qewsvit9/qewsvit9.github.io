    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(11, 16, 28, 0.95);
            --border-color: #1e293b;
            --accent: #38bdf8;
            --green: #22c55e;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #0d1b33 0%, transparent 70%);
            color: var(--text-main);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
            cursor: url('https://api.iconify.design/lucide:paw-print.svg?color=%2338bdf8&width=24'), auto;
        }

        /* Морозный экран при Крампусе */
        #frost-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            transition: opacity 1s ease;
            background: radial-gradient(circle, rgba(56,189,248,0.25) 0%, rgba(255,255,255,0.5) 100%);
            box-shadow: inset 0 0 150px rgba(255,255,255,0.8);
        }
        #frost-overlay.active { opacity: 1; }

        /* Снегопад */
        .snowflake {
            position: absolute;
            top: -50px;
            color: #ffffff;
            user-select: none;
            pointer-events: none;
            z-index: 5;
            animation: snowfall linear infinite;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.7));
        }

        @keyframes snowfall {
            0% { transform: translateY(-50px) translateX(0) rotate(0deg); }
            50% { transform: translateY(50vh) translateX(35px) rotate(180deg); }
            100% { transform: translateY(105vh) translateX(-35px) rotate(360deg); }
        }

        /* Фиксированный счетчик пасхалок */
        .easter-counter {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-family: 'Unbounded', sans-serif;
            font-size: 11px;
            color: #fff;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            cursor: pointer;
            transition: 0.2s;
        }
        .easter-counter:hover { transform: scale(1.05); }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            padding: 20px;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
