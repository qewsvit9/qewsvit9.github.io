<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qewsvit9.github.io - Ultimate Winter Hub</title>
    <!-- Фавикон (спарк) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'><path d='M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050811;
            --card-bg: rgba(11, 16, 28, 0.9);
            --border-color: #1e293b;
            --accent: #38bdf8;
            --green: #22c55e;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* Кастомный фурри-курсор */
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #0d1b33 0%, transparent 70%);
            color: var(--text-main);
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow-x: hidden;
            cursor: url('https://api.iconify.design/lucide:paw-print.svg?color=%2338bdf8&width=24'), auto;
        }

        /* Морозные узоры на окне (активируются при метели) */
        #frost-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            transition: opacity 1s ease;
            background: radial-gradient(circle, rgba(56,189,248,0.1) 0%, rgba(255,255,255,0.2) 100%);
            box-shadow: inset 0 0 100px rgba(255,255,255,0.4);
        }
        #frost-overlay.active { opacity: 1; }

        /* Снежинки */
        .snowflake {
            position: absolute;
            top: -20px;
            background: #ffffff;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0.9; }
            50% { transform: translateY(50vh) translateX(20px) rotate(180deg); opacity: 0.6; }
            100% { transform: translateY(105vh) translateX(-20px) rotate(360deg); opacity: 0.1; }
        }

        /* Счетчик пасхалок (топ-право) */
        .easter-counter {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Unbounded', sans-serif;
            font-size: 12px;
            color: #fff;
            z-index: 1001;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            cursor: help;
        }

        /* Модалка КУККИ */
        #cookie-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        #cookie-modal.show { opacity: 1; pointer-events: auto; }
        .cookie-card {
            background: #111827;
            border: 3px solid;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            animation: popUp 0.3s ease;
        }
        @keyframes popUp {
            0% { transform: scale(0.7); }
            100% { transform: scale(1); }
        }

        /* Редкости стили */
        .rarity-common { border-color: #94a3b8; }
        .rarity-rare { border-color: #38bdf8; box-shadow: 0 0 15px #38bdf8; }
        .rarity-epic { border-color: #a855f7; box-shadow: 0 0 20px #a855f7; animation: pulseEpic 2s infinite; }
        .rarity-legendary { border-color: #f59e0b; box-shadow: 0 0 25px #f59e0b; }
        .rarity-mythic { border-color: #ef4444; box-shadow: 0 0 25px #ef4444; }
        .rarity-ultra { border-color: #06b6d4; box-shadow: 0 0 30px #06b6d4; }
        .rarity-chromatic { border-image: linear-gradient(45deg, red, yellow, green, cyan, blue, violet) 1; }
        .rarity-absolute { border-color: #ff007f; box-shadow: 0 0 40px #ff007f, inset 0 0 20px #3b82f6; background: #000; }

        @keyframes pulseEpic { 0%, 100% { opacity: 0.8; } 50%
